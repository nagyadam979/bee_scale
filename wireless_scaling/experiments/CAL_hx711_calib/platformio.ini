; bee_scale HX711 KALIBRÁCIÓS firmware (NODE-variáns) — ESP32-C3 SuperMini · PlatformIO
;
; Önálló bench/off-grid eszköz a mérleg-cella kalibrációjához. NEM prod firmware.
; A prod node olvasói (sens_hx711.c, sens_ds18b20.c) a main/-be MÁSOLVA vannak.
;
; Fordítás:        pio run -e cal_node
; Flash + monitor: pio run -e cal_node -t upload -t monitor   (natív USB-Serial-JTAG)
; A logot a felhasználó a saját termináljában nézi: pio device monitor -p <PORT> -b 115200

[platformio]
src_dir = main
default_envs = cal_node

[env:cal_node]
platform = espressif32
framework = espidf
; Nincs dedikált "SuperMini" board-def; a generikus C3 DevKitM-1 megfelel (RISC-V, 4 MB flash).
board = esp32-c3-devkitm-1
board_build.partitions = partitions.csv
monitor_speed = 115200
