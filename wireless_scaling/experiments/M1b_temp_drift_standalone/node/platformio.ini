; M1b — STANDALONE off-grid hő-drift mérő · NODE · ESP32-C3 SuperMini · PlatformIO build
;
; Miért: a gépen PlatformIO Core van (idf.py külön nincs), így a TISZTA ESP-IDF projektet
; PlatformIO-val fordítjuk. A natív ESP-IDF layout (gyökér CMakeLists.txt + main/ komponens)
; megmarad; a `src_dir = main` mondja meg a PIO-nak, hogy a fő komponens a main/.
;
; M1b: NINCS rádió, NINCS master, NINCS PC a mérés alatt. A node nagy power bankról fut,
; deep-sleep ciklusban méri + AT24C32 EEPROM-ba logolja a drift + HX711 adatot. PC-re dugva
; (cold boot) DUMP-módba megy és a konzolra írja a logot.
;
; Fordítás:        pio run
; Flash:           pio run -t upload     (a SuperMini natív USB-Serial-JTAG-ján; alvó boardnál BOOT+reset)
; Dump-olvasás:    pio device monitor -p <PORT> -b 115200   (a felhasználó saját termináljában;
;                  ezen a gépen a JTAG-CDC log háttérből NEM olvasható)

[platformio]
src_dir = main

[env:esp32-c3-supermini]
; espressif32 >= 6.11 kell a C3 + újabb ESP-IDF-hez. Verziót szándékosan nem pinnelünk:
; a legújabb stabil platformot húzza; a tényleges verzió a build-logban marad.
platform = espressif32
framework = espidf
; Nincs dedikált "SuperMini" board-def. A generikus C3 DevKitM-1 megfelel (RISC-V toolchain,
; 4 MB flash); a SuperMini eltérő lábkiosztását a kód nem igényli.
board = esp32-c3-devkitm-1
monitor_speed = 115200
