; bee_scale MASTER firmware — ESP32-S3-Zero · peripheral readout stage
;
; First stable master firmware step: no radio, no cloud, no sleep. It continuously reads
; the final master peripherals and prints machine-grepable serial logs.
;
; Build:           pio run
; Flash + monitor: pio run -t upload -t monitor --upload-port /dev/cu.usbmodemXXXX

[platformio]
src_dir = main

[env:esp32-s3-zero]
platform = espressif32
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
monitor_speed = 115200
