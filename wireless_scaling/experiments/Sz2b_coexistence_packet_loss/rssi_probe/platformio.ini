; Sz2b RSSI-PROBE — antenna-diagnosztika: 1 board ↔ 1 referencia-AP (dlink-EDA4)
;
; CÉL: az S3-Zero antenna-gyanú (P3 tanulság: ~30-40 dB link-budget deficit) számszerűsítése
; úgy, hogy a KÉT-ESP32 bizonytalanságot kizárjuk: minden boardot ugyanahhoz a routerhez
; mérünk. A firmware STA-ként csatlakozik, majd másodpercenként riportolja az AP RSSI-jét
; telneten (23-as port) + UDP-broadcastban (5005) + a soros konzolon.
;
; FOLYAMAT: board rádugása USB-re -> flash a megfelelő env-vel -> telnet-teszt -> lehúzás,
; sima tápra a hosszabbítón -> a Mac a dlink-EDA4-en ülve telnetezi / hallgatja az UDP-t,
; miközben a board-router távolság változik.
;
; HITELESÍTŐK: a master gitignorolt creds.ini-jéből (SZ2B_WIFI_SSID/PASS) — nincs duplikáció.
;
; Fordítás:  pio run -e s3zero    (ill. -e c3super)
; Flash:     pio run -e s3zero -t upload --upload-port /dev/cu.usbmodemXXXX
;            (alvó C3-nál nem kell flash-elkapó: a probe always-on)

[platformio]
src_dir = main
extra_configs = ../master/creds.ini

[env]
platform = espressif32
framework = espidf
monitor_speed = 115200

; ESP32-S3-Zero (a bench master boardja) — 4 MB flash kényszerítés, mint a masternél
; (a devkitc-1 board-def 8 MB-os image-headere boot-loopot okoz a 4 MB-os S3FH4R2-n).
[env:s3zero]
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
build_flags = -DPROBE_NAME=\"s3zero\" ${creds.build_flags}

; ESP32-C3 SuperMini — a TX-power itt is 8,5 dBm (34), mint az Sz2b node-oknál: teljes
; poweren a SuperMini PA torzít (típus-szintű hiba), és a probe-nak TX is kell (telnet/DHCP).
; Az RSSI-mérést (RX, AP->board) a csökkentett TX-power nem befolyásolja.
[env:c3super]
board = esp32-c3-devkitm-1
build_flags = -DPROBE_NAME=\"c3super\" -DPROBE_TX_POWER=34 ${creds.build_flags}
