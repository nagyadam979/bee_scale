; Sz2b NODE — csatorna-scan discovery + wake→átadás protokoll · ESP32-C3 SuperMini
;
; Az Sz6 node build-mintája (lásd ott a részletes indoklást): tiszta ESP-IDF projekt
; PlatformIO-val fordítva, natív main/ layout (src_dir = main). A közös wire-header a
; firmware/common/protocol.h (befagyasztott kontraktus).
;
; HÁROM NODE, EGY FORRÁS: a node-azonosítót build-flag adja (SZ2B_NODE_ID).
; Fordítás:        pio run -e node1   (ill. -e node2 / -e node3)
; Flash:           alvó node-nál a flash-elkapó KÖTELEZŐ (a deep sleep alatt a C3 nem
;                  enumerál USB-n): ../../Sz6_wake_handoff/tools/flash_catch.sh
;                  "$PWD" node1 /dev/cu.usbmodemXXXX
;
; ⚠️ TX-POWER: MINDKÉT SuperMini példányon SZ2B_TX_POWER=34 (8,5 dBm) — az Sz6-ban a node2,
; az Sz2b P3 soakban a node1 bizonyult torzítónak teljes poweren (21 dBm): pár méteres,
; valós távolságon a master a node1 ch8-as unicast/broadcast próbáit nem vette, miközben a
; 8,5 dBm-es node2 ugyanonnan hibátlan volt. A SuperMini antenna-illesztési hibája tehát
; nem példány-, hanem TÍPUS-szintű kockázat -> alapértelmezés a csökkentett power; új node
; (node3) is ezzel indul, és csak mérés után emelhető.

[platformio]
src_dir = main

[env]
platform = espressif32
framework = espidf
; Nincs dedikált "SuperMini" board-def. A generikus C3 DevKitM-1 megfelel (RISC-V toolchain,
; 4 MB flash); a SuperMini eltérő lábkiosztását a kód nem igényli (csak rádió, nincs GPIO).
board = esp32-c3-devkitm-1
monitor_speed = 115200

[env:node1]
build_flags = -DSZ2B_NODE_ID=1 -DSZ2B_TX_POWER=34

[env:node2]
build_flags = -DSZ2B_NODE_ID=2 -DSZ2B_TX_POWER=34

; A 3. node később érkezik — env előkészítve (csökkentett power a fenti tanulság szerint).
[env:node3]
build_flags = -DSZ2B_NODE_ID=3 -DSZ2B_TX_POWER=34
