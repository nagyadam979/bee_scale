; Sz2b NODE — csatorna-scan discovery + wake→átadás protokoll · ESP32-C3 SuperMini
;
; Az Sz6 node build-mintája (lásd ott a részletes indoklást): tiszta ESP-IDF projekt
; PlatformIO-val fordítva, natív main/ layout (src_dir = main). A közös wire-header a
; firmware/common/protocol.h (befagyasztott kontraktus).
;
; HÁROM NODE, EGY FORRÁS: a node-azonosítót build-flag adja (SZ2B_NODE_ID).
; Fordítás:        pio run -e node1   (ill. -e node2 / -e node3)
; Flash:           alvó node-nál a flash-elkapó KÖTELEZŐ (a deep sleep alatt a C3 nem
;                  enumerál USB-n): ../../Sz6_wake_handoff/tools/flash_catch.sh
;                  "$PWD" node1 /dev/cu.usbmodemXXXX
;
; ⚠️ node2: SZ2B_TX_POWER=34 (8,5 dBm) KÖTELEZŐ — a példány antenna-hibás, teljes poweren
; ~4% a kézbesítése (Sz6 tanulság). A TX-power PÉLDÁNYFÜGGŐ: új node-nál (node3) teljes
; powerrel indulunk, és csak igazolt RF-hiba esetén csökkentünk.

[platformio]
src_dir = main

[env]
platform = espressif32
framework = espidf
; Nincs dedikált "SuperMini" board-def. A generikus C3 DevKitM-1 megfelel (RISC-V toolchain,
; 4 MB flash); a SuperMini eltérő lábkiosztását a kód nem igényli (csak rádió, nincs GPIO).
board = esp32-c3-devkitm-1
monitor_speed = 115200

[env:node1]
build_flags = -DSZ2B_NODE_ID=1

[env:node2]
build_flags = -DSZ2B_NODE_ID=2 -DSZ2B_TX_POWER=34

; A 3. node később érkezik — env előkészítve (teljes TX power, amíg RF-hiba nincs igazolva).
[env:node3]
build_flags = -DSZ2B_NODE_ID=3
