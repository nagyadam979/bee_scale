; Sz2b MASTER — WiFi STA + ESP-NOW koegzisztencia · ESP32-S3-Zero
;
; Az Sz6 master build-mintája: tiszta ESP-IDF projekt PlatformIO-val fordítva, natív main/
; layout (src_dir = main). A közös wire-header a firmware/common/protocol.h.
;
; FÁZISONKÉNTI ENV-EK (a tesztterv 1..3 fázisa — SZ2B_WIFI_MODE build-flag):
;   p1-espnow-only   MODE=0  baseline: csak ESP-NOW, fix 1-es csatorna (Sz6-minta)
;   p2-sta-idle      MODE=1  STA-connect + ESP-NOW, forgalom nélkül
;   p3-sta-traffic   MODE=2  STA + periodikus gateway-forgalom + ESP-NOW (teljes koegzisztencia)
;
; WIFI HITELESÍTŐK: a creds.ini-ben (gitignored!) — minta: creds.ini.example. A p2/p3 env
; e nélkül nem fordul (szándékos #error a forrásban).
;
; Fordítás:        pio run -e p1-espnow-only
; Flash + monitor: pio run -e p1-espnow-only -t upload --upload-port /dev/cu.usbmodemXXXX
; A master always-on -> a portja stabilan enumerál, a log a
; ../../Sz6_wake_handoff/tools/serial_logger.py-jal háttérből olvasható.

[platformio]
src_dir = main
extra_configs = creds.ini

[env]
platform = espressif32
framework = espidf
; Nincs dedikált "S3-Zero" board-def. A generikus S3 DevKitC-1 megfelel (Xtensa LX7).
board = esp32-s3-devkitc-1
; FLASH MÉRET — KRITIKUS (a H4 tanulsága): az S3-Zero ESP32-S3FH4R2 (4 MB flash + 2 MB PSRAM),
; de a devkitc-1 board-def 8 MB-ot ír a binary image-headerbe -> boot-time assert + reboot-loop,
; az app_main SOSEM fut le. A flash-méretet upload- ÉS build-szinten is 4 MB-ra kényszerítjük.
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
monitor_speed = 115200

[env:p1-espnow-only]
build_flags = -DSZ2B_WIFI_MODE=0

[env:p2-sta-idle]
build_flags = -DSZ2B_WIFI_MODE=1 ${creds.build_flags}

[env:p3-sta-traffic]
build_flags = -DSZ2B_WIFI_MODE=2 ${creds.build_flags}
