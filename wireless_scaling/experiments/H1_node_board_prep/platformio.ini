; H1 — Node board előkészítés (deep-sleep áram) · PlatformIO build
;
; Miért: a gépen PlatformIO Core van (idf.py toolchain külön nincs), így a TISZTA ESP-IDF
; projektet PlatformIO-val fordítjuk. A natív ESP-IDF layout (gyökér CMakeLists.txt + main/
; komponens) MEGMARAD — a `src_dir = main` mondja meg a PIO-nak, hogy a fő komponens a main/.
; Így a projekt idf.py-vel ÉS pio-val is fordul, a forráshoz nem kellett hozzányúlni.
;
; Fordítás:        pio run
; Flash + monitor: pio run -t upload -t monitor   (a SuperMini natív USB-Serial-JTAG-ján)

[platformio]
src_dir = main

[env:esp32-c3-supermini]
; espressif32 >= 6.11 kell a C3 + újabb ESP-IDF támogatáshoz. Verziót szándékosan nem
; pinnelünk: a legújabb stabil platformot húzza; a tényleges verzió a build-logban marad.
platform = espressif32
framework = espidf
; Nincs dedikált "SuperMini" board-def. A generikus C3 DevKitM-1 megfelel (RISC-V toolchain,
; 4 MB flash); a SuperMini eltérő lábkiosztását a kód kezeli, a board-def attól független.
board = esp32-c3-devkitm-1
monitor_speed = 115200
