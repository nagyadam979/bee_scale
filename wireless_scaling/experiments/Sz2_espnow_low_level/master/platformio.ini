; Sz2 MASTER (RX) — ESP-NOW low-level recv · classic ESP-WROOM-32 · PlatformIO build
;
; Miért: a gépen PlatformIO Core van; a TISZTA ESP-IDF projektet PlatformIO-val fordítjuk.
; A natív ESP-IDF layout (gyökér CMakeLists.txt + main/) MEGMARAD — `src_dir = main`.
; A közös headert (../../common) a main/CMakeLists.txt INCLUDE_DIRS húzza be.
;
; Fordítás:        pio run
; Flash + monitor: pio run -t upload -t monitor   (a WROOM-32 USB-UART bridge-én, UART0)
; A master logja az UART0-n megy -> ezen a gépen háttérből OLVASHATÓ (a végső riport ott jelenik meg).

[platformio]
src_dir = main

[env:esp32-wroom-32]
platform = espressif32
framework = espidf
; Klasszikus ESP32 dev board (WROOM-32, dual-core Xtensa, USB-UART bridge, UART0 konzol).
board = esp32dev
monitor_speed = 115200
