; H4 — Master board deep-sleep áram (ESP32-S3-Zero) · PlatformIO build
;
; Miért: a gépen PlatformIO Core van (idf.py toolchain külön nincs), így a TISZTA ESP-IDF
; projektet PlatformIO-val fordítjuk. A natív ESP-IDF layout (gyökér CMakeLists.txt + main/
; komponens) MEGMARAD — a `src_dir = main` mondja meg a PIO-nak, hogy a fő komponens a main/.
; Így a projekt idf.py-vel ÉS pio-val is fordul, a forráshoz nem kellett hozzányúlni.
;
; Fordítás:        pio run
; Flash + monitor: pio run -t upload -t monitor   (az S3-Zero natív USB-Serial-JTAG-ján)
; Flash tartós deep sleepnél: BOOT nyomva + reset -> bootloader, majd `pio run -t upload`.

[platformio]
src_dir = main

[env:esp32-s3-zero]
; espressif32 platform (legújabb stabil, verziót szándékosan nem pinnelünk).
platform = espressif32
framework = espidf
; Nincs dedikált "S3-Zero" board-def. A generikus S3 DevKitC-1 megfelel (Xtensa LX7
; toolchain); az S3-Zero eltérő lábkiosztását a kód kezeli. A flash-méretet (4 MB, az
; S3FH4R2-höz) az sdkconfig.defaults állítja; a board-def default 8 MB miatt lehet warning.
board = esp32-s3-devkitc-1
monitor_speed = 115200
