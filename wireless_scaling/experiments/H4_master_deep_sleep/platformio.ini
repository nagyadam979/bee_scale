; H4 — Master board deep-sleep áram (ESP32-S3-Zero) · PlatformIO build
;
; Miért: a gépen PlatformIO Core van (idf.py toolchain külön nincs), így a TISZTA ESP-IDF
; projektet PlatformIO-val fordítjuk. A natív ESP-IDF layout (gyökér CMakeLists.txt + main/
; komponens) MEGMARAD — a `src_dir = main` mondja meg a PIO-nak, hogy a fő komponens a main/.
; Így a projekt idf.py-vel ÉS pio-val is fordul, a forráshoz nem kellett hozzányúlni.
;
; Fordítás:        pio run
; Flash + monitor: pio run -t upload -t monitor   (az S3-Zero natív USB-Serial-JTAG-ján)
; Flash tartós deep sleepnél: BOOT nyomva + reset -> bootloader, majd `pio run -t upload`.

[platformio]
src_dir = main

[env:esp32-s3-zero]
; espressif32 platform (legújabb stabil, verziót szándékosan nem pinnelünk).
platform = espressif32
framework = espidf
; Nincs dedikált "S3-Zero" board-def. A generikus S3 DevKitC-1 megfelel (Xtensa LX7
; toolchain); az S3-Zero eltérő lábkiosztását a kód kezeli.
board = esp32-s3-devkitc-1
; FLASH MÉRET — KRITIKUS: az S3-Zero az ESP32-S3FH4R2-t használja (4 MB flash + 2 MB PSRAM),
; de a devkitc-1 board-def 8 MB-ot ír a binary image-headerbe -> boot-time assert:
;   "Detected size(4096k) smaller than the size in the binary image header(8192k). Probe failed."
; -> reboot loop, az app_main SOSEM fut le. Ezért a flash-méretet upload- ÉS build-szinten is
; explicit 4 MB-ra kényszerítjük (a puszta CONFIG_ESPTOOLPY_FLASHSIZE_4MB az sdkconfig-ban nem elég,
; mert a board-def upload.flash_size felülírja, és ez kerül az image-headerbe).
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
monitor_speed = 115200
