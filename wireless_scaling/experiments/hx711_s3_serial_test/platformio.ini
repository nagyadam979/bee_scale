; Egyszerű HX711 teszt — ESP32-S3, Arduino framework, PlatformIO
; DT=GPIO4, SCK=GPIO2 ; nyers érték a Serial monitorra 115200 baudon
;
; Feltöltés + monitor:  pio run -t upload -t monitor

[env:esp32-s3-devkitc-1]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
; A lapkán 4 MB flash van (a devkitc-1 alapból 8 MB-ot feltételez) -> felülírjuk,
; különben boot-loop: "Detected size(4096k) smaller than ... header(8192k)".
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = default.csv
; USB CDC bekapcsolása, hogy a Serial a natív USB porton menjen
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1
