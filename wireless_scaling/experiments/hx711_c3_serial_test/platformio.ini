; Egyszerű HX711 teszt — ESP32-C3 SuperMini, Arduino framework, PlatformIO
; DT=GPIO3, SCK=GPIO4 ; nyers érték a Serial monitorra 115200 baudon
;
; Feltöltés + monitor:  pio run -t upload -t monitor

[env:esp32-c3-supermini]
platform = espressif32
framework = arduino
; Nincs dedikált SuperMini board-def; a generikus C3 DevKitM-1 megfelel (4 MB flash).
board = esp32-c3-devkitm-1
monitor_speed = 115200
; USB CDC bekapcsolása, hogy a Serial a natív USB-Serial-JTAG porton menjen.
; A C3-on csak HWCDC (JTAG) van, ehhez az ARDUINO_USB_MODE=1 is kell.
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
