; Sz6 MASTER — always-on RX + app-ACK · ESP32-S3-Zero · PlatformIO build
;
; Miért: a gépen PlatformIO Core van; a TISZTA ESP-IDF projektet PlatformIO-val fordítjuk.
; A natív ESP-IDF layout (gyökér CMakeLists.txt + main/) MEGMARAD — `src_dir = main`.
; A közös wire-header a firmware/common/protocol.h, a main/CMakeLists.txt húzza be.
;
; Fordítás:        pio run
; Flash + monitor: pio run -t upload --upload-port /dev/cu.usbmodemXXXX
; A master always-on (sosem alszik) -> a portja stabilan enumerál, a log a
; tools/serial_logger.py-jal háttérből olvasható.

[platformio]
src_dir = main

[env:esp32-s3-zero]
platform = espressif32
framework = espidf
; Nincs dedikált "S3-Zero" board-def. A generikus S3 DevKitC-1 megfelel (Xtensa LX7).
board = esp32-s3-devkitc-1
; FLASH MÉRET — KRITIKUS (a H4 tanulsága): az S3-Zero ESP32-S3FH4R2 (4 MB flash + 2 MB PSRAM),
; de a devkitc-1 board-def 8 MB-ot ír a binary image-headerbe -> boot-time assert + reboot-loop,
; az app_main SOSEM fut le. A flash-méretet upload- ÉS build-szinten is 4 MB-ra kényszerítjük.
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
monitor_speed = 115200
