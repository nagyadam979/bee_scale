; Sz6 NODE — ébredés→megszólítás→átadás protokoll · ESP32-C3 SuperMini · PlatformIO build
;
; Miért: a gépen PlatformIO Core van (idf.py toolchain külön nincs), így a TISZTA ESP-IDF
; projektet PlatformIO-val fordítjuk. A natív ESP-IDF layout (gyökér CMakeLists.txt + main/
; komponens) MEGMARAD — a `src_dir = main` mondja meg a PIO-nak, hogy a fő komponens a main/.
; A közös wire-header a firmware/common/protocol.h (befagyasztott kontraktus), a
; main/CMakeLists.txt INCLUDE_DIRS húzza be.
;
; KÉT NODE, EGY FORRÁS: a node-azonosítót build-flag adja (SZ6_NODE_ID), ezért két env van.
; Fordítás:        pio run -e node1   (ill. -e node2)
; Flash:           pio run -e node1 -t upload --upload-port /dev/cu.usbmodemXXXX
; Alvó node-nál a flash-elkapó: ../tools/flash_catch.sh (a deep sleep alatt a C3 nem
; enumerál USB-n — az awake-ablakban kell elkapni).

[platformio]
src_dir = main

[env]
platform = espressif32
framework = espidf
; Nincs dedikált "SuperMini" board-def. A generikus C3 DevKitM-1 megfelel (RISC-V toolchain,
; 4 MB flash); a SuperMini eltérő lábkiosztását a kód nem igényli (csak rádió, nincs GPIO).
board = esp32-c3-devkitm-1
monitor_speed = 115200

[env:node1]
build_flags = -DSZ6_NODE_ID=1

[env:node2]
build_flags = -DSZ6_NODE_ID=2
