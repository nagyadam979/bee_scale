; bee_scale HX711 KALIBRÁCIÓS firmware (MASTER-variáns) — ESP32-S3-Zero · PlatformIO
;
; Önálló bench/off-grid eszköz a master mérleg-cella kalibrációjához. NEM prod firmware.
; A prod master olvasói (sens_hx711.c, sens_ds18b20.c) a main/-be MÁSOLVA/ÁTEMELVE vannak.
;
; Fordítás:        pio run -e cal_master
; Flash + monitor: pio run -e cal_master -t upload -t monitor   (natív USB-Serial-JTAG)
;
; MEGJEGYZÉS: a prod master UART-konzolt használ, de ez az önálló cal-eszköz a natív
; USB-Serial-JTAG konzolt (az egyetlen USB-C csatlakozón), mint a node-variáns — így az
; interaktív w/g/d/s/e parancsok az S3-Zero USB-portján mennek. Lásd sdkconfig.defaults.

[platformio]
src_dir = main
default_envs = cal_master

[env:cal_master]
platform = espressif32
framework = espidf
; A prod master boardja (S3-Zero → generikus S3 DevKitC-1, xtensa, 4 MB flash).
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
monitor_speed = 115200
