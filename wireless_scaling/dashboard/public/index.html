<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>bee_scale — kaptármérleg</title>
  <link rel="stylesheet" href="style.css" />
  <!-- ECharts (UMD global: window.echarts) — modern, touch-zoomolható chartok -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <!-- Adatréteg-konfiguráció (window.BEESCALE_CONFIG) — az app.js előtt töltődik -->
  <script src="config.js"></script>
</head>
<body>
  <!-- ===== Splash (anonim auth) ===== -->
  <section id="splash" class="splash">
    <div class="splash-card">
      <div class="logo">🐝</div>
      <h1>bee_scale</h1>
      <p id="splash-status" class="muted">Csatlakozás…</p>
      <p id="splash-error" class="error hidden"></p>
    </div>
  </section>

  <!-- ===== App ===== -->
  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand"><span class="logo-sm">🐝</span> bee_scale</div>
      <nav id="hive-tabs" class="tabs" aria-label="Telepítés"></nav>
      <button id="refresh-btn" class="icon-btn" title="Frissítés">⟳</button>
    </header>

    <main class="main">
      <!-- Telepítés-szintű időjárás -->
      <section id="weather" class="weather"></section>

      <!-- Fő súly-chart: az adott telepítés összes mérlege egy charton -->
      <section class="panel">
        <div class="panel-head">
          <div>
            <span class="panel-title">Súly</span>
            <span id="weight-note" class="panel-note muted"></span>
          </div>
          <button class="ghost-btn" data-reset="weight-chart">⟲ Teljes nézet</button>
        </div>
        <div id="weight-chart" class="chart"></div>
      </section>

      <!-- Belső hőmérséklet-chart -->
      <section class="panel">
        <div class="panel-head">
          <div><span class="panel-title">Belső hőmérséklet</span></div>
          <button class="ghost-btn" data-reset="temp-chart">⟲ Teljes nézet</button>
        </div>
        <div id="temp-chart" class="chart chart-sm"></div>
      </section>

      <!-- Kompakt állapot-kártyák -->
      <section id="cards" class="cards"></section>

      <p id="load-status" class="load-status muted"></p>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
