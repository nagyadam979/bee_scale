; bee_scale MASTER — ESP32-S3-Zero · final master firmware

[platformio]
src_dir = main

[env:esp32-s3-zero]
platform = espressif32
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags = -DMASTER_CLOUD_MODE=0

[env:esp32-s3-zero-cloud]
platform = espressif32
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags = -DMASTER_CLOUD_MODE=1
