; bee_scale MASTER — ESP32-S3-Zero · final master firmware

[platformio]
src_dir = main

; TEST ONLY: a scan env logjabol deritsd ki a teszt AP primer 2.4 GHz csatornajat,
; majd itt ird at. A production env-ek ezt nem hasznaljak, ott marad a kodbeli ch6 default.
[bee_test]
espnow_channel = 9
scan_max_aps = 32

[env:esp32-s3-zero]
platform = espressif32
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags = -DMASTER_CLOUD_MODE=0

; Helyi, felho-fuggetlen statuszoldal a kozos WiFi-n.
; Elotte: cp main/wifi_config.example.h main/wifi_config.h
[env:esp32-s3-zero-local-status]
extends = env:esp32-s3-zero
build_flags =
    -DMASTER_CLOUD_MODE=0
    -DMASTER_WEB_STATUS=1

[env:esp32-s3-zero-test]
extends = env:esp32-s3-zero
build_flags =
    -DMASTER_CLOUD_MODE=0
    -DMASTER_TEST_MODE=1
    -DMASTER_ESPNOW_CHANNEL=${bee_test.espnow_channel}
    -DMASTER_NODE_PERIOD_SEC=60
    -DMASTER_NODE_SLOT_SPACING_SEC=5

[env:esp32-s3-zero-local-status-test]
extends = env:esp32-s3-zero-local-status
build_flags =
    -DMASTER_CLOUD_MODE=0
    -DMASTER_WEB_STATUS=1
    -DMASTER_TEST_MODE=1
    -DMASTER_ESPNOW_CHANNEL=${bee_test.espnow_channel}
    -DMASTER_NODE_PERIOD_SEC=60
    -DMASTER_NODE_SLOT_SPACING_SEC=5

[env:esp32-s3-zero-test-scan]
extends = env:esp32-s3-zero
build_flags =
    -DMASTER_CLOUD_MODE=0
    -DMASTER_TEST_MODE=1
    -DMASTER_WIFI_SCAN_DIAG=1
    -DMASTER_SCAN_MAX_APS=${bee_test.scan_max_aps}
    -DMASTER_ESPNOW_CHANNEL=${bee_test.espnow_channel}
    -DMASTER_NODE_PERIOD_SEC=60
    -DMASTER_NODE_SLOT_SPACING_SEC=5

[env:esp32-s3-zero-cloud]
platform = espressif32
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
monitor_speed = 115200
build_flags =
    -DMASTER_CLOUD_MODE=1
    -DMASTER_FIREBASE_TARGET_HIVE_ID=\"hive2\"
    -DMASTER_CLOUD_HIVE2_SCHEMA=1

[env:esp32-s3-zero-cloud-test]
extends = env:esp32-s3-zero-cloud
build_flags =
    -DMASTER_CLOUD_MODE=1
    -DMASTER_TEST_MODE=1
    -DMASTER_ESPNOW_CHANNEL=${bee_test.espnow_channel}
    -DMASTER_NODE_PERIOD_SEC=60
    -DMASTER_NODE_SLOT_SPACING_SEC=5
    -DMASTER_FIREBASE_ROOT_PATH=\"experiments/sz6_overnight\"
    -DMASTER_CLOUD_UPLOAD_MASTER=0
