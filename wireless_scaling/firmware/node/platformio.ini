; bee_scale NODE firmware — ESP32-C3 SuperMini · PlatformIO build
;
; Miért: a gépen PlatformIO Core van (idf.py toolchain külön nincs), így a TISZTA ESP-IDF
; projektet PlatformIO-val fordítjuk. A natív ESP-IDF layout (gyökér CMakeLists.txt + main/
; komponens) MEGMARAD — a `src_dir = main` mondja meg a PIO-nak, hogy a fő komponens a main/.
; A közös headert (../common) a main/CMakeLists.txt INCLUDE_DIRS húzza be.
;
; Fordítás:        pio run
; Flash + monitor: pio run -t upload -t monitor   (a SuperMini natív USB-Serial-JTAG-ján)
; FONTOS: a node logja EZEN a gépen háttérből NEM olvasható (JTAG-CDC); a felhasználó a saját
; termináljában nézi: pio device monitor -p <PORT> -b 115200.

[platformio]
src_dir = main
default_envs = node1, node2, node3, esp32-c3-sleep-floor

; TEST ONLY: a master `esp32-s3-zero-test-scan` logjabol deritsd ki a teszt AP
; primer 2.4 GHz csatornajat, majd itt ird at. A production node env-ek ch6-on maradnak.
[bee_test]
espnow_channel = 9
node_wake_period_sec = 60

[env:base_c3]
; espressif32 >= 6.11 kell a C3 + újabb ESP-IDF-hez. Verziót szándékosan nem pinnelünk:
; a legújabb stabil platformot húzza; a tényleges verzió a build-logban marad.
platform = espressif32
framework = espidf
; Nincs dedikált "SuperMini" board-def. A generikus C3 DevKitM-1 megfelel (RISC-V toolchain,
; 4 MB flash); a SuperMini eltérő lábkiosztását a kód nem igényli.
board = esp32-c3-devkitm-1
board_build.partitions = partitions.csv
monitor_speed = 115200

[env:node1]
extends = env:base_c3
build_flags =
    -D NODE_PROFILE=NODE_PROFILE_FIELD
    -D NODE_ID=1
    -D NODE_VBAT_ENABLED=0

[env:node2]
extends = env:base_c3
build_flags =
    -D NODE_PROFILE=NODE_PROFILE_FIELD
    -D NODE_ID=2
    -D NODE_VBAT_ENABLED=1
    -D NODE_TX_POWER=34

[env:node2-test]
extends = env:node2
build_flags =
    ${env:node2.build_flags}
    -D NODE_TEST_MODE=1
    -D NODE_WIFI_CHANNEL=${bee_test.espnow_channel}
    -D NODE_WAKE_PERIOD_SEC=${bee_test.node_wake_period_sec}

[env:node3]
extends = env:base_c3
build_flags =
    -D NODE_PROFILE=NODE_PROFILE_FIELD
    -D NODE_ID=3
    -D NODE_VBAT_ENABLED=1

[env:esp32-c3-supermini]
extends = env:base_c3

[env:esp32-c3-sleep-floor]
extends = env:base_c3
build_flags =
    -D NODE_PROFILE=NODE_PROFILE_SLEEP_FLOOR
